<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><style>
.g,.tw,.blink,.fl,.pop,.st,.cf,.hb,.sw,.sh,.bob,.tilt,.clap1,.clap2{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
.bob{animation:bob 2.6s ease-in-out infinite}
.hb{animation:hb 1.6s ease-in-out infinite}
.sh{animation:sh 1.1s ease-in-out infinite;transform-origin:50% 90%}
.sw{animation:sw 3s ease-in-out infinite;transform-origin:50% 100%}
.tilt{animation:tilt 2.4s ease-in-out infinite;transform-origin:50% 90%}
.tw{animation:tw 1.8s ease-in-out infinite}
.tw:nth-of-type(2n){animation-delay:.6s}.tw:nth-of-type(3n){animation-delay:1.1s}
.blink{animation:blink 3.6s infinite}
.fl{animation:fl .9s ease-in-out infinite alternate;transform-origin:50% 100%}
.pop{animation:pop 1.8s ease-out infinite}
.pop:nth-of-type(2n){animation-delay:.6s}.pop:nth-of-type(3n){animation-delay:1.2s}
.st{animation:st 2.4s ease-in infinite}
.st:nth-of-type(2n){animation-delay:.8s}.st:nth-of-type(3n){animation-delay:1.6s}
.cf{animation:cf 1.4s ease-in-out infinite alternate}
.cf:nth-of-type(2n){animation-delay:.5s}
.clap1{animation:c1 .8s ease-in-out infinite;transform-origin:20% 90%}
.clap2{animation:c2 .8s ease-in-out infinite;transform-origin:80% 90%}
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes hb{0%,100%{transform:scale(1)}15%{transform:scale(1.1)}30%{transform:scale(.97)}45%{transform:scale(1.06)}}
@keyframes sh{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-4deg) scale(1.03,.97)}75%{transform:rotate(4deg) scale(1.03,.97)}}
@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes tilt{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-2px)}}
@keyframes tw{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1.15);opacity:1}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.94,1.07)}}
@keyframes pop{0%{transform:translateY(0);opacity:0}15%{opacity:1}60%{transform:translateY(-14px);opacity:1}100%{transform:translateY(-18px);opacity:0}}
@keyframes st{0%{transform:translateY(4px);opacity:0}30%{opacity:.7}100%{transform:translateY(-16px);opacity:0}}
@keyframes cf{from{transform:translateY(0) rotate(0)}to{transform:translateY(-5px) rotate(25deg)}}
@keyframes c1{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}
@keyframes c2{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg)}}
</style><defs><radialGradient id="rp" cx=".35" cy=".28" r=".9"><stop offset="0" stop-color="#ffb3c1"/><stop offset=".45" stop-color="#ef233c"/><stop offset="1" stop-color="#7a0010"/></radialGradient><radialGradient id="rp2" cx=".4" cy=".25" r=".9"><stop offset="0" stop-color="#ff8fa3"/><stop offset=".6" stop-color="#d00024"/><stop offset="1" stop-color="#6a000e"/></radialGradient><linearGradient id="rs" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7bd88f"/><stop offset="1" stop-color="#1e7a36"/></linearGradient></defs><ellipse cx="64" cy="119" rx="22" ry="5" fill="#000" opacity=".18"/><g class="sw"><path d="M62 70c2 18 0 32-4 48" fill="none" stroke="url(#rs)" stroke-width="7" stroke-linecap="round"/><path d="M60 98c-16-2-26-10-28-22 14-2 24 6 28 22z" fill="url(#rs)"/><path d="M62 92c12-6 24-6 32 0-8 8-20 8-32 0z" fill="url(#rs)"/><path d="M64 14c22 0 38 14 38 34 0 18-16 30-38 30S26 66 26 48c0-20 16-34 38-34z" fill="url(#rp)"/><path d="M40 36c6-14 22-18 32-12-12 2-18 10-18 22-6-2-12-6-14-10z" fill="url(#rp2)"/><path d="M88 36c-4-10-14-14-24-12 10 4 14 12 12 22 6-2 10-6 12-10z" fill="url(#rp2)"/><path d="M50 50c2-10 10-14 18-12 6 2 8 8 6 12-4-4-10-4-14 0-4 3-6 3-10 0z" fill="#9d0018"/><path d="M36 58c8 10 20 14 30 12 10-2 18-8 22-16-2 12-12 22-28 22-12 0-22-8-24-18z" fill="#8a0014" opacity=".55"/><ellipse cx="46" cy="26" rx="10" ry="5" fill="#fff" opacity=".55" transform="rotate(-25 46 26)"/></g></svg>